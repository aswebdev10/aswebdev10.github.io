st.toggle(\"has-completed\", completedCount > 0);\n    }\n    const hadCompletedSection = !!sectionsEl.querySelector('.section[data-key=\"__completed\"]');\n    sectionsEl.innerHTML = \"\";\n    const keys = groupOrder();\n\n    if(!keys.length){\n      const sec=document.createElement(\"section\");\n      sec.className=\"section empty-section\";\n      sec.innerHTML=currentTab===\"completed\"\n        ? '\u003cdiv class=\"section-head\">\u003ch2 class=\"section-title\">Completed (0)\u003c/h2>\u003c/div>\u003cdiv class=\"empty-note\">No completed tasks yet.\u003c/div>'\n        : '\u003cdiv class=\"section-head\">\u003ch2 class=\"section-title today\">Today\u003c/h2>\u003c/div>\u003cdiv class=\"empty-note\">No tasks yet.\u003c/div>';\n      sectionsEl.appendChild(sec);\n      return;\n    }\n\n    keys.forEach(key=>{\n      const sec=document.createElement(\"section\");\n      sec.className=\"section\";\n      sec.dataset.key=key;\n\n      const head=document.createElement(\"div\");\n      head.className=\"section-head\";\n      const title=document.createElement(\"h2\");\n      title.className=\"section-title\" + (key===localDateISO() ? \" today\":\"\");\n      title.textContent = key === \"__completed\" ? `Completed (${tasks.filter(t=>t.completed).length})` : dateLabel(key);\n      head.appendChild(title);\n\n      if(key===\"__completed\"){\n        if(options.animateCompletedEntry && !hadCompletedSection){\n          sec.classList.add(\"completed-enter\");\n          sec.addEventListener(\"animationend\",()=>sec.classList.remove(\"completed-enter\"),{once:true});\n        }\n        const clear=document.createElement(\"button\");\n        clear.className=\"clear-btn\";\n        clear.textContent=\"Empty\";\n        clear.addEventListener(\"click\",()=>{\n          if(confirm(\"Delete all completed tasks?\")){\n            tasks=tasks.filter(t=>!t.completed); save(); render();\n          }\n        });\n        head.appendChild(clear);\n      }\n      sec.appendChild(head);\n\n      const list=document.createElement(\"div\");\n      list.className=\"task-list\";\n      list.dataset.key=key;\n\n      tasks\n        .filter(t=>sectionKey(t)===key)\n        .sort((a,b)=>(a.order??0)-(b.order??0))\n        .forEach(task=>list.appendChild(makeRow(task,key)));\n\n      sec.appendChild(list);\n      sectionsEl.appendChild(sec);\n    });\n  }\n\n  function animateReorder(list, mutate){\n    if(!list){ mutate(); return; }\n    const before=new Map([...list.children].map(el=>[el.dataset.id,el.getBoundingClientRect()]));\n    mutate();\n    if(window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    [...list.children].forEach(el=>{\n      if(el.classList.contains(\"dragging\")) return;\n      const first=before.get(el.dataset.id);\n      if(!first) return;\n      const last=el.getBoundingClientRect();\n      const dy=first.top-last.top;\n      if(Math.abs(dy)\u003c1) return;\n      el.animate(\n        [{transform:`translateY(${dy}px)`},{transform:\"translateY(0)\"}],\n        {duration:180,easing:\"cubic-bezier(.2,.8,.2,1)\"}\n      );\n    });\n  }\n\n  function makeRow(task,key){\n    const row=document.createElement(\"div\");\n    row.className=\"task-row\" + (task.completed ? \" completed\":\"\");\n    row.dataset.id=task.id;\n    row.draggable=true;\n\n    const checkArea=document.createElement(\"div\");\n    checkArea.className=\"check-area\";\n\n    const check=document.createElement(\"input\");\n    check.type=\"checkbox\";\n    check.className=\"check\";\n    check.checked=task.completed;\n    check.setAttribute(\"aria-label\", task.completed ? \"Mark incomplete\":\"Mark complete\");\n    checkArea.appendChild(check);\n\n    checkArea.addEventListener(\"click\",e=>{\n      e.stopPropagation();\n      if(e.target !== check){\n        check.checked = !check.checked;\n        check.dispatchEvent(new Event(\"change\"));\n      }\n    });\n\n    check.addEventListener(\"click\",e=>e.stopPropagation());\n    check.addEventListener(\"change\",()=>{\n      const becomingCompleted = check.checked;\n      window.setTimeout(()=>{\n        task.completed=becomingCompleted;\n        task.order=nextOrder(sectionKey(task));\n        save();\n        render();\n      },400);\n    });\n\n    const name=document.createElement(\"div\");\n    name.className=\"task-name\";\n    name.textContent=task.name;\n\n    row.append(checkArea,name);\n    row.addEventListener(\"click\", e=>{\n      if(e.target===check || e.target.closest(\".check-area\")) return;\n      openEdit(task.id);\n    });\n\n    row.addEventListener(\"dragstart\",e=>{\n      row.classList.add(\"dragging\");\n      e.dataTransfer.effectAllowed=\"move\";\n      e.dataTransfer.setData(\"text/plain\",task.id);\n    });\n    row.addEventListener(\"dragend\",()=>{\n      row.classList.remove(\"dragging\");\n      row.classList.add(\"drop-pop\");\n      persistDomOrder(key);\n      row.addEventListener(\"animationend\",()=>row.classList.remove(\"drop-pop\"),{once:true});\n    });\n    row.addEventListener(\"dragover\",e=>{\n      e.preventDefault();\n      const list=row.parentElement;\n      const dragging=list.querySelector(\".dragging\");\n      if(!dragging || dragging===row) return;\n      const rect=row.getBoundingClientRect();\n      const beforeNode=e.clientY \u003c rect.top+rect.height/2 ? row : row.nextSibling;\n      animateReorder(list,()=>list.insertBefore(dragging,beforeNode));\n    });\n\n    // Touch reordering: hold briefly, then the task follows your finger.\n    // If scrolling/movement is detected first, reordering is disabled for that touch.\n    let touchStartX=0, touchStartY=0, draggedByTouch=false, touchScrollDetected=false;\n\n    const updateGhost=(clientX,clientY)=>{\n      if(!touchDrag || !touchDrag.ghost) return;\n      touchDrag.ghost.style.left=(clientX-touchDrag.offsetX)+\"px\";\n      touchDrag.ghost.style.top=(clientY-touchDrag.offsetY)+\"px\";\n    };\n\n    const onTouch ediately, during the long-press delay.\n      // Any meaningful movement cancels reordering for this entire touch.\n      document.addEventListener(\"touchmove\",onTouchMove,{passive:false});\n      document.addEventListener(\"touchend\",finishTouch);\n      document.addEventListener(\"touchcancel\",finishTouch);\n\n      longPressTimer=setTimeout(()=>{\n        if(touchScrollDetected) return;\n        const rect=row.getBoundingClientRect();\n        const ghost=row.cloneNode(true);\n        ghost.classList.remove(\"dragging\",\"drag-source\",\"drop-pop\",\"completing\");\n        ghost.classList.add(\"drag-ghost\");\n        ghost.removeAttribute(\"draggable\");\n        ghost.style.width=rect.width+\"px\";\n        ghost.style.height=rect.height+\"px\";\n        ghost.style.left=rect.left+\"px\";\n        ghost.style.top=rect.top+\"px\";\n\n        const ghostCheck=ghost.querySelector(\".check\");\n        if(ghostCheck) ghostCheck.disabled=true;\n\n        document.body.appendChild(ghost);\n\n        touchDrag={\n          row,\n          list:row.parentElement,\n          key,\n          ghost,\n          offsetX:t.clientX-rect.left,\n          offsetY:t.clientY-rect.top\n        };\n\n        row.classList.add(\"dragging\",\"drag-source\");\n        document.body.style.overflow=\"hidden\";\n        if(navigator.vibrate) navigator.vibrate(25);\n        updateGhost(t.clientX,t.clientY);\n      },250);\n    },{passive:true});\n\n    row.addEventListener(\"touchend\",()=>{\n      if(!touchDrag || touchDrag.row!==row) clearTimeout(longPressTimer);\n    },{passive:true});\n\n    row.addEventListener(\"touchcancel\",()=>{\n      if(!touchDrag || touchDrag.row!==row) clearTimeout(longPressTimer);\n    },{passive:true});\n\n    row.addEventListener(\"click\",e=>{\n      if(draggedByTouch){\n        e.preventDefault();\n        e.stopImmediatePropagation();\n      }\n    },true);\n\n    return row;\n  }\n\n  function nextOrder(key){\n    const arr=tasks.filter(t=>sectionKey(t)===key);\n    return arr.length ? Math.max(...arr.map(t=>t.order??0))+1 : 0;\n  }\n\n  function persistDomOrder(key){\n    const list=sectionsEl.querySelector(`.task-list[data-key=\"${CSS.escape(key)}\"]`);\n    if(!list) return;\n    [...list.children].forEach((row,i)=>{\n      const t=tasks.find(x=>x.id===row.dataset.id);\n      if(t) t.order=i;\n    });\n    save();\n  }\n\n  function openModal(task=null){\n    editingId=task?.id || null;\n    modalTitle.textContent=task ? \"Edit task\":\"Add task\";\n    nameInput.value=task?.name || \"\";\n    dateInput.value=task?.date || \"\";\n    deleteBtn.style.display=task ? \"block\":\"none\";\n    modalBackdrop.classList.add(\"open\");\n    modalBackdrop.setAttribute(\"aria-hidden\",\"false\");\n    setTimeout(()=>nameInput.focus(),50);\n  }\n  function closeModal(){\n    modalBackdrop.classList.remove(\"open\");\n    modalBackdrop.setAttribute(\"aria-hidden\",\"true\");\n    editingId=null;\n    form.reset();\n  }\n  function openEdit(id){\n    const task=tasks.find(t=>t.id===id);\n    if(task) openModal(task);\n  }\n\n  settingsBtn.addEventListener(\"click\",openSettings);\n  doneSettingsBtn.addEventListener(\"click\",closeSettings);\n  settingsBackdrop.addEventListener(\"click\",e=>{if(e.target===settingsBackdrop)closeSettings();});\n  rowHeightRange.addEventListener(\"input\",()=>updateSetting(\"rowHeight\",rowHeightRange.value));\n  checkboxSizeRange.addEventListener(\"input\",()=>updateSetting(\"checkboxSize\",checkboxSizeRange.value));\n  fontSizeRange.addEventListener(\"input\",()=>updateSetting(\"fontSize\",fontSizeRange.value));\n  resetSettingsBtn.addEventListener(\"click\",()=>{settings={...DEFAULT_SETTINGS};applySettings();saveSettings();parent.postMessage({type:'tasks-lists:startup-change',value:'tasks'},'*');});\n\n  document.querySelectorAll(\".tab\").forEach(tab=>{\n    tab.addEventListener(\"click\",()=>{\n      currentTab=tab.dataset.tab;\n      document.querySelectorAll(\".tab\").forEach(t=>t.classList.toggle(\"active\",t===tab));\n      render();\n    });\n  });\n\n  document.getElementById(\"addBtn\").addEventListener(\"click\",()=>openModal());\n  document.getElementById(\"cancelBtn\").addEventListener(\"click\",closeModal);\n  modalBackdrop.addEventListener(\"click\",e=>{ if(e.target===modalBackdrop) closeModal(); });\n\n  form.addEventListener(\"submit\",e=>{\n    e.preventDefault();\n    const name=nameInput.value.trim();\n    const date=dateInput.value;\n    if(!name) return;\n\n    if(editingId){\n      const task=tasks.find(t=>t.id===editingId);\n      if(task){\n        const oldKey=sectionKey(task);\n        task.name=name;\n        task.date=date;\n        const newKey=sectionKey(task);\n        if(oldKey!==newKey) task.order=nextOrder(newKey);\n      }\n    }else{\n      const newTask={id:crypto.randomUUID(),name,date,completed:false,fav:false,order:0};\n      newTask.order=nextOrder(sectionKey(newTask));\n      tasks.push(newTask);\n    }\n    save(); closeModal(); render();\n  });\n\n  deleteBtn.addEventListener(\"click\",()=>{\n    if(!editingId) return;\n    tasks=tasks.filter(t=>t.id!==editingId);\n    save(); closeModal(); render();\n  });\n\n  document.addEventListener(\"keydown\",e=>{\n    if(e.key!==\"Escape\") return;\n    if(settingsBackdrop.classList.contains(\"open\")) closeSettings();\n    else if(modalBackdrop.classList.contains(\"open\")) closeModal();\n  });\n\n  render();\n\nfor(const action of ['export','import'])document.getElementById(action+'Backup').onclick=()=>parent.postMessage({type:'tasks-lists:backup-action',action},'*');\nwindow.addEventListener('message',event=>{if(event.source!==parent)return;if(event.data?.type==='tasks-lists:backup-status')document.getElementById('backupStatus').textContent=event.data.message;if(event.data?.type==='tasks-lists:backup-busy'){for(const action of ['export','import'])document.getElementById(action+'Backup').disabled=event.data.busy;}});\n\ndocument.getElementById('startupChoice').addEventListener('change',()=>parent.postMessage({type:'tasks-lists:startup-change',value:document.getElementById('startupChoice').value},'*'));\nwindow.addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='tasks-lists:startup-value')document.getElementById('startupChoice').value=event.data.value;if(event.source===parent&&event.data?.type==='tasks-lists:backup-busy')document.getElementById('startupChoice').disabled=event.data.busy;});\nparent.postMessage({type:'tasks-lists:startup-request'},'*');\n})();\n\u003c/script>\n\n\n\n\u003c/body>\n\u003c/html>\n", "lists": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n\u003ctitle>Lists\u003c/title>\n\u003cmeta name=\"theme-color\" content=\"#eeeeF1\" />\n\u003cmeta name=\"apple-mobile-web-app-capable\" content=\"yes\" />\n\u003cmeta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\" />\n\u003cmeta name=\"apple-mobile-web-app-title\" content=\"Lists\" />\n\n\n\u003cstyle>\n  :root{\n    --bg:#eeeeF1;\n    --card:#ffffff;\n    --text:#111111;\n    --muted:#aeb0b4;\n    --blue:#4285f4;\n    --lav:#d5ddff;\n    --danger:#d93025;\n    --line:#ececef;\n    --task-row-height:44px;\n    --task-check-size:22px;\n    --task-font-size:16px;\n  }\n  *{box-sizing:border-box}\n  [hidden]{display:none!important}\n  html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}\n  body{padding-bottom:0}\n  button,input{font:inherit}\n\n  .phone{\n    width:min(100%,760px);\n    margin:0 auto;\n    min-height:100vh;\n    background:var(--bg);\n  }\n\n  .topbar{\n    height:72px;\n    padding:22px 42px 0;\n    display:flex;\n    position:sticky;\n    top:0;\n    z-index:50;\n    background:var(--bg);\n    align-items:flex-start;\n    gap:30px;\n  }\n  .star-logo{\n    width:30px;height:30px;display:grid const KEY='tasksLists_lastSection_v1',frames={tasks:document.getElementById('tasksFrame'),lists:document.getElementById('listsFrame')},menu=document.getElementById('appMenu');
let current='tasks';try{const saved=localStorage.getItem(KEY);if(saved==='lists'||saved==='tasks')current=saved;}catch{}
const STARTUP_KEY='tasksLists_startup_v1';let startup='tasks';try{const saved=localStorage.getItem(STARTUP_KEY);if(['tasks','lists','last'].includes(saved))startup=saved;}catch{}if(startup!=='last')current=startup;
function update(){for(const name of ['tasks','lists']){frames[name].hidden=name!==current;document.getElementById(name==='tasks'?'chooseTasks':'chooseLists').setAttribute('aria-pressed',String(name===current));}document.title=current==='tasks'?'Tasks — Tasks & Lists':'Lists — Tasks & Lists';}
function closeMenu(){if(backupBusy)return;menu.close();frames[current].focus();}
function select(name){current=name;try{localStorage.setItem(KEY,name);document.getElementById('storageNotice').hidden=true;}catch{document.getElementById('storageNotice').hidden=false;}update();if(name==='lists')frames.lists.contentWindow.postMessage({type:'tasks-lists:all-lists'},'*');closeMenu();}
window.addEventListener('message',event=>{if(event.source!==frames[current].contentWindow||event.data?.type!=='tasks-lists:open-menu')return;update();if(!menu.open)menu.showModal();document.getElementById(current==='tasks'?'chooseTasks':'chooseLists').focus();});

menu.addEventListener('click',event=>{if(event.target!==menu)return;const r=menu.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeMenu();});
const BACKUP_KEYS={tasks:'myTasksReplica_v1',lists:'myLists_v1',taskSettings:'myTasksReplica_settings_v1',listSettings:'myLists_settings_v1',lastSection:KEY,startup:STARTUP_KEY};
const TASK_DEFAULTS={rowHeight:44,checkboxSize:22,fontSize:16},LIST_DEFAULTS={rowHeight:46,listHeight:64,aisleSize:16,fontSize:18,checkboxSize:24};
const statusNode=document.getElementById('backupStatus');const backupStatus={get textContent(){return statusNode.textContent},set textContent(value){statusNode.textContent=value;frames[current].contentWindow.postMessage({type:'tasks-lists:backup-status',message:value},'*');}};const fileInput=document.getElementById('backupFile');
function record(v){return v!==null&&typeof v==='object'&&!Array.isArray(v);}
function check(condition,message){if(!condition)throw new Error(message);}
function textValue(v,max,label){check(typeof v==='string'&&v.trim().length>0&&v.length<=max,'Invalid '+label+'.');return v;}
function bool(v,fallback=false){check(v===undefined||typeof v==='boolean','Invalid completion value.');return v??fallback;}
function unique(items,label){const seen=new Set();for(const item of items){check(!seen.has(item.id),'Duplicate '+label+' IDs.');seen.add(item.id);}}
function appearance(value,defaults,bounds){check(record(value),'Invalid appearance settings.');const clean={};for(const [key,initial] of Object.entries(defaults)){const n=value[key]??initial;const [min,max]=bounds[key];check(Number.isInteger(n)&&n>=min&&n<=max,'Invalid '+key+' setting.');clean[key]=n;}return clean;}
function validateBackup(raw){
 check(record(raw)&&raw.format==='tasks-and-lists-backup'&&raw.version===1,'This is not a supported Tasks & Lists backup.');
 const d=raw.data;check(record(d)&&Array.isArray(d.tasks)&&Array.isArray(d.lists),'Backup must contain tasks and lists.');check(d.tasks.length<=50000&&d.lists.length<=10000,'Backup is too large.');
 const tasks=d.tasks.map(t=>{check(record(t),'Invalid task.');const id=textValue(t.id,200,'task ID'),name=textValue(t.name,180,'task name');const date=t.date??'';check(typeof date==='string'&&(date===''||(/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(Date.parse(date+'T12:00:00Z'))&&new Date(date+'T12:00:00Z').toISOString().slice(0,10)===date)),'Invalid task date.');const order=t.order??0;check(Number.isFinite(order)&&order>=0,'Invalid task order.');return {id,name,date,completed:bool(t.completed),fav:bool(t.fav),order};});unique(tasks,'task');
 let itemCount=0;
 const lists=d.lists.map(l=>{check(record(l)&&Array.isArray(l.items),'Invalid list.');const id=textValue(l.id,200,'list ID'),name=textValue(l.name,180,'list name'),sort=l.sort??'manual';check(sort==='manual'||sort==='aisle','Invalid list sort mode.');itemCount+=l.items.length;check(itemCount<=50000,'Backup has too many items.');const items=l.items.map(i=>{check(record(i),'Invalid item.');const aisle=i.aisle??'';check(typeof aisle==='string'&&aisle.length<=40,'Invalid aisle.');const item={id:textValue(i.id,200,'item ID'),name:textValue(i.name,180,'item name'),aisle,completed:bool(i.completed)};if(i.linkId!==undefined)item.linkId=textValue(i.linkId,200,'linked item ID');return item;});unique(items,'item');return {id,name,sort,items};});unique(lists,'list');

}
function readBackup(){const get=(key,fallback)=>{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v);};return {format:'tasks-and-lists-backup',version:1,exportedAt:new Date().toISOString(),data:{tasks:get(BACKUP_KEYS.tasks,[]),lists:get(BACKUP_KEYS.lists,[]),taskSettings:get(BACKUP_KEYS.taskSettings,TASK_DEFAULTS),listSettings:get(BACKUP_KEYS.listSettings,LIST_DEFAULTS),lastSection:current,startup}};}
function replaceData(data){const previous={};for(const key of Object.values(BACKUP_KEYS))previous[key]=localStorage.getItem(key);
 try{for(const [field,key] of Object.entries(BACKUP_KEYS))localStorage.setItem(key,(field==='lastSection'||field==='startup')?data[field]:JSON.stringify(data[field]));}
 catch(error){let restored=true;for(const [key,value] of Object.entries(previous)){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}catch{restored=false;}}throw new Error(restored?'Import failed. Your previous data was restored.':'Import failed and previous data could not be fully restored. Keep your backup file.');}
}
let backupBusy=false;menu.addEventListener('cancel',event=>{if(backupBusy)event.preventDefault();});
function busy(value){backupBusy=value;for(const frame of Object.values(frames))frame.contentWindow.postMessage({type:'tasks-lists:backup-busy',busy:value},'*');document.getElementById('menuDone').disabled=value;document.getElementById('exportBackup').disabled=value;document.getElementById('importBackup').disabled=value;document.getElementById('chooseTasks').disabled=value;document.getElementById('chooseLists').disabled=value;}
const settleChanges=()=>new Promise(resolve=>setTimeout(resolve,450));
document.getElementById('exportBackup').onclick=async()=>{busy(true);backupStatus.textContent='Preparing backup…';try{await settleChanges();const backup=readBackup();backup.data=validateBackup(backup);const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Tasks-and-Lists-backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);backupStatus.textContent='Backup download started.';}catch(error){backupStatus.textContent='Could not export: '+error.message;}finally{busy(false);}};
document.getElementById('importBackup').onclick=()=>{fileInput.value='';fileInput.click();};
window.addEventListener('message',event=>{if(event.source!==frames[current].contentWindow||event.data?.type!=='tasks-lists:backup-action'||backupBusy)return;if(event.data.action==='export')document.getElementById('exportBackup').onclick();else if(event.data.action==='import')document.getElementById('importBackup').onclick();});
fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;busy(true);backupStatus.textContent='Checking backup…';try{check(file.size<=10*1024*1024,'Backup must be smaller than 10 MB.');const data=validateBackup(JSON.parse(await file.text()));const count=data.lists.reduce((total,l)=>total+l.items.length,0);const accepted=confirm(`Replace ALL current tasks, lists, and settings with this backup?\n\n${data.tasks.length} tasks, ${data.lists.length} lists, ${count} items.\n\nThis replaces existing data; it does not merge. Export a backup first if you want to keep your current data.`);if(!accepted){backupStatus.textContent='Import cancelled. Your data was not changed.';return;}await settleChanges();replaceData(data);startup=data.startup;current=startup==='last'?data.lastSection:startup;for(const name of ['tasks','lists'])frames[name].srcdoc=sources[name];update();backupStatus.textContent='Backup imported successfully.';}catch(error){backupStatus.textContent='Could not import: '+error.message;}finally{busy(false);fileInput.value='';}});

 if(!Object.values(frames).some(frame=>frame.contentWindow===event.source))return;

for(const name of ['tasks','lists'])frames[name].srcdoc=sources[name];update();
