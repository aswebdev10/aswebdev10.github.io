<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lists</title>
<meta name="theme-color" content="#eeeeF1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Lists" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<style>
  :root{
    --bg:#eeeeF1;
    --card:#ffffff;
    --text:#111111;
    --muted:#aeb0b4;
    --blue:#4285f4;
    --lav:#d5ddff;
    --danger:#d93025;
    --line:#ececef;
    --task-row-height:44px;
    --task-check-size:22px;
    --task-font-size:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
  body{padding-bottom:0}
  button,input{font:inherit}

  .phone{
    width:min(100%,760px);
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
  }

  .topbar{
    height:72px;
    padding:22px 42px 0;
    display:flex;
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg);
    align-items:flex-start;
    gap:30px;
  }
  .star-logo{
    width:30px;height:30px;display:grid;place-items:center;font-size:30px;line-height:1;
  }
  .tab{
    position:relative;
    font-size:17px;
    line-height:30px;
    color:var(--muted);
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab.has-completed{color:#111}
  .tab.active{color:var(--blue)}
  .tab::after{
    content:"";
    position:absolute;
    height:5px;
    border-radius:4px;
    left:0;right:0;
    bottom:-13px;
    background:var(--blue);
    display:none;
  }
  .tab.active::after{display:block}
  .new-list{
    font-size:17px;
    line-height:30px;
    display:flex;gap:16px;align-items:center;white-space:nowrap;
  }
  .plus-inline{font-size:36px;font-weight:300;transform:translateY(-1px)}
  .settings-btn{margin-left:auto;width:36px;height:36px;border:0;background:transparent;color:#111;display:grid;place-items:center;padding:0;cursor:pointer;font-size:25px;line-height:1;border-radius:50%;transform:translateY(-3px);-webkit-tap-highlight-color:transparent}
  .settings-btn:active{background:rgba(0,0,0,.06)}

  .list-header{
    margin:0 15px 4px;
    height:70px;
    background:var(--card);
    border-radius:26px 26px 7px 7px;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .list-header h1{margin:0;font-size:22px;letter-spacing:-.3px}
  .header-actions{display:flex;align-items:center;gap:18px}
  .icon-btn{
    border:0;background:transparent;padding:8px;cursor:pointer;color:#111;
    font-size:15px;line-height:1;
  }
  .sort-icon{font-size:26px}
  .dots{font-size:30px;transform:translateY(-2px)}

  #sections{padding:0 15px 78px}
  .section{
    background:var(--card);
    border-radius:8px;
    margin-bottom:4px;
    overflow:hidden;
  }
  .section-head{
    min-height:36px;
    padding:8px 27px 2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .section-title{
    margin:0;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.25px;
  }
  .section-title.today{color:var(--blue)}
  .clear-btn{
    border:0;background:transparent;color:var(--danger);font-weight:700;
    padding:8px 0;cursor:pointer;font-size:17px;
  }
  .task-list{padding:0 0 3px}
  .task-row{
    min-height:var(--task-row-height);
    display:grid;
    grid-template-columns:48px 1fr;
    align-items:center;
    gap:8px;
    padding:0 24px 0 20px;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:pan-y;
    position:relative;
    background:#fff;
  }
  .task-row *,
  .task-name{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .task-row::selection,
  .task-row *::selection{background:transparent;}
  .task-row.dragging{
    opacity:.92;
    z-index:10;
    box-shadow:0 8px 30px rgba(0,0,0,.14);
    border-radius:12px;
    touch-action:none;
  }
  .task-row.completed .task-name{
    text-decoration:line-through;
    color:#777;
  }
  .check-area{
    width:calc(100% + 20px);
    height:100%;
    min-height:var(--task-row-height);
    margin-left:-20px;
    padding-left:20px;
    display:grid;
    place-items:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .check{
    appearance:none;
    width:var(--task-check-size);height:var(--task-check-size);
    border:2px solid #111;
    border-radius:50%;
    margin:0;
    cursor:pointer;
    display:grid;place-items:center;
    background:white;
  }
  .check:checked{
    background:var(--blue);
    border-color:var(--blue);
  }
  .check:checked::after{
    content:"✓";
    color:white;
    font-weight:bold;
    font-size:15px;
    transform:translateY(-1px);
  }
  .task-name{
    font-size:var(--task-font-size);
    line-height:1.18;
    overflow-wrap:anywhere;
    cursor:pointer;
  }
  .fav{
    border:0;background:transparent;color:#b6b8bb;
    font-size:27px;line-height:1;cursor:pointer;padding:2px;
  }
  .fav.active{color:#f4b400}
  .empty-note{
    color:#777;
    padding:0 36px 22px;
    font-size:16px;
  }

  .fab{
    position:fixed;
    right:max(calc((100vw - min(100vw,760px))/2 + 24px),24px);
    bottom:max(31px, calc(env(safe-area-inset-bottom) + 20px));
    width:56px;height:56px;
    border:0;border-radius:17px;
    background:var(--lav);
    color:#31507d;
    font-size:30px;font-weight:300;
    box-shadow:0 12px 26px rgba(0,0,0,.18);
    cursor:pointer;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.36);
    display:none;align-items:flex-start;justify-content:center;z-index:100;
  }
  .modal-backdrop.open{display:flex}
  .modal{
    width:min(100%,760px);
    background:#fff;
    border-radius:0 0 28px 28px;
    padding:24px 26px calc(28px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 35px rgba(0,0,0,.18);
  }
  .grab{width:48px;height:5px;border-radius:4px;background:#d0d0d0;margin:0 auto 22px}
  .modal h2{font-size:26px;margin:0 0 20px}
  .field{display:block;margin-bottom:18px}
  .field span{display:block;font-size:15px;font-weight:700;color:#555;margin-bottom:7px}
  .field input{
    width:100%;height:52px;border:1.5px solid #dadce0;border-radius:12px;
    padding:0 14px;font-size:19px;outline:none;
  }
  .field input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(66,133,244,.12)}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:6px}
  .modal-actions button{
    border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;
  }
  .secondary{background:#f1f3f4}
  .primary{background:var(--blue);color:#fff}
  .delete{background:#fce8e6!important;color:var(--danger);margin-right:auto}
  .setting-row{margin-bottom:24px}
  .setting-label{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px;font-size:16px;font-weight:700}
  .setting-value{color:#666;font-variant-numeric:tabular-nums;font-weight:600}
  .setting-range{width:100%;accent-color:var(--blue);cursor:pointer}
  .settings-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
  .settings-actions button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
  .reset-settings{background:#f1f3f4;color:#111}
  .done-settings{background:var(--blue);color:#fff;margin-left:auto}

  @media (max-width:520px){
    .topbar{height:66px;padding:19px 24px 0;gap:25px}
    .star-logo{font-size:28px;width:28px;height:28px}
    .tab{font-size:17px;line-height:28px}
    .tab::after{bottom:-12px;height:4px}
    .section-head{min-height:32px;padding:7px 21px 2px}
    .section-title{font-size:16px}
    .task-row{grid-template-columns:50px 1fr;padding:0 18px 0 14px;min-height:var(--task-row-height);gap:6px}
    .task-name{font-size:var(--task-font-size)}
    .check{width:var(--task-check-size);height:var(--task-check-size)}
    .fab{width:54px;height:54px;border-radius:16px;font-size:29px}
  }

  /* Motion */
  .task-row{
    transition: opacity .22s ease, transform .22s ease, max-height .26s ease,
                min-height .26s ease, padding .26s ease, margin .26s ease;
  }
  .task-row.completing{
    opacity:0;
    transform:translateY(24px) scale(.97);
    min-height:0 !important;
    max-height:0 !important;
    padding-top:0 !important;
    padding-bottom:0 !important;
    overflow:hidden;
  }
  .task-row.dragging{
    transition:none;
    transform:scale(1.018);
  }
  .task-row.drop-pop{
    animation:dropPop .24s ease;
  }
  .section.completed-enter{
    animation:completedEnter .28s cubic-bezier(.2,.8,.2,1);
    transform-origin:top center;
  }
  @keyframes completedEnter{
    0%{opacity:0;transform:translateY(12px) scale(.99)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes dropPop{
    0%{transform:scale(.985)}
    60%{transform:scale(1.012)}
    100%{transform:scale(1)}
  }
  .drag-ghost{
    position:fixed;
    z-index:9999;
    pointer-events:none;
    margin:0;
    background:#fff;
    border-radius:10px;
    box-shadow:0 8px 22px rgba(0,0,0,.20);
    opacity:.98;
    transform:scale(1.015);
    will-change:top,left;
  }
  .task-row.drag-source{
    opacity:.12;
  }

  @media (prefers-reduced-motion: reduce){
    .task-row{transition:none !important;animation:none !important}
  }
</style>
<style>
:root{--list-row-height:64px;--item-row-height:46px;--list-font-size:16px;--aisle-font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.back{border:0;background:transparent;font-size:25px;cursor:pointer;padding:0;width:32px;height:32px;flex-shrink:0;color:#111}.list-nav{display:flex;align-items:center;gap:10px;padding:0 20px 8px;min-height:40px}.list-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.rows{background:#fff;border-radius:8px;padding-bottom:3px}.task-row{grid-template-columns:48px minmax(0,1fr) 32px;min-height:var(--list-row-height);padding:0 24px 0 20px;gap:8px;border:0}.task-row.item-row{grid-template-columns:48px minmax(0,1fr) auto;min-height:var(--item-row-height)}.row-main{border:0;background:none;text-align:left;padding:6px 0;cursor:pointer;min-width:0;color:inherit}.row-title{font-size:var(--list-font-size);line-height:1.18;overflow-wrap:anywhere}.row-sub{font-size:13px;line-height:1.2;color:#777;margin-top:3px}.handle{position:static;opacity:1;pointer-events:auto;border:0;background:transparent;color:#92969e;font-size:23px;cursor:grab;padding:2px;touch-action:none;min-height:32px}.handle:disabled{opacity:.45;cursor:default}.check-label{width:calc(100% + 20px);height:100%;min-height:var(--item-row-height);margin-left:-20px;padding-left:20px;display:grid;place-items:center;cursor:pointer}.check{width:var(--task-check-size);height:var(--task-check-size)}.aisle{font-size:var(--aisle-font-size);color:#666;max-width:100px;overflow-wrap:anywhere;padding:0 4px}.task-row.completed .row-title{text-decoration:line-through;color:#777}.task-row.completed .aisle{color:#777}.edit{border:0;background:none;padding:6px;color:#666;cursor:pointer;font-size:22px}.empty-note{margin:0;color:#777;padding:0 36px 22px;font-size:16px}.section-head{padding:8px 27px 2px;min-height:36px}.section-title.items-title{color:var(--blue)}
.fab{width:56px;height:56px;padding:0;display:grid;place-items:center}.fab span{font-size:30px;font-weight:300;line-height:1}
dialog{position:fixed;inset:0 0 auto;margin:0 auto;border:0;width:min(100%,760px);max-width:100%;max-height:100dvh;border-radius:0 0 28px 28px;padding:24px 26px calc(28px + env(safe-area-inset-bottom));box-shadow:0 10px 35px #0003}dialog::backdrop{background:#0006}dialog h2{font-size:26px;margin:0 0 20px}.sort-option{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;border:0;background:#f5f6f8;border-radius:12px;margin:8px 0;text-align:left;cursor:pointer}.sort-option[aria-pressed=true]{background:#e8f0fe;color:#1967d2;font-weight:700}.sort-option[aria-pressed=true]::after{content:'✓'}.sort-done{display:block;margin:18px 0 0 auto;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.status{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:10px;z-index:200;max-width:90vw}.status:empty{display:none}
@media(max-width:520px){.topbar{height:66px;padding:19px 24px 0;gap:25px}.screen-title{font-size:17px;line-height:28px}.section-head{min-height:32px;padding:7px 21px 2px}.section-title{font-size:16px}.task-row{grid-template-columns:50px minmax(0,1fr) 28px;padding:0 18px 0 14px;gap:6px}.task-row.item-row{grid-template-columns:50px minmax(0,1fr) auto}.aisle{max-width:75px}.fab{width:54px;height:54px}.list-nav{padding-left:14px;padding-right:18px}}

</style></head>
<body><div class="phone"><header class="topbar"><button type="button" class="star-logo" id="logo" aria-label="Back to all lists" title="All lists">★</button><button type="button" class="tab active screen-title" id="title" aria-pressed="true"><span id="titleLabel">Lists</span></button><button type="button" class="tab" id="completedTab" aria-pressed="false" hidden>Completed (0)</button><button class="settings-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">⚙</button></header><main id="sections"><span id="count" class="sr-only"></span><section id="activeSection" class="section"><div class="section-head" id="activeHead" hidden><h2 class="section-title items-title">Items</h2><input type="hidden" id="sort" value="manual"><button type="button" id="sortBtn" class="icon-btn sort-icon" aria-label="Sort items" title="Sort items">⇅</button></div><div id="rows" class="rows"></div></section><section id="completedSection" class="section completed-section" aria-labelledby="completedTitle" hidden><div class="section-head"><h2 id="completedTitle" class="section-title">Completed (0)</h2><button type="button" class="clear-btn" id="clearCompleted">Empty</button></div><div id="completedRows" class="rows"></div></section><div class="hint" id="hint" hidden></div></main></div><button class="fab" id="addBtn" aria-label="Add list" title="Add list"><span aria-hidden="true">＋</span></button><dialog id="editor" aria-labelledby="modalTitle"><div class="grab" aria-hidden="true"></div><h2 id="modalTitle"></h2><form id="form"><label class="field"><span id="nameLabel">List name</span><input id="name" maxlength="180" required autocomplete="off"></label><label class="field" id="aisleField"><span>Aisle (optional)</span><input id="aisle" maxlength="40" placeholder="e.g. A2, 12, Produce" autocomplete="off"></label><div class="modal-actions"><button class="delete" id="deleteBtn" type="button">Delete</button><button class="secondary" id="cancel" type="button">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="grab" aria-hidden="true"></div><h2 id="settingsTitle">Settings</h2>
<div class="setting-row"><label class="setting-label" for="listHeightRange"><span>List row height</span><output class="setting-value" id="listHeightValue" for="listHeightRange"></output></label><input class="setting-range" id="listHeightRange" type="range" min="34" max="88" step="1" value="64"></div>
<div class="setting-row"><label class="setting-label" for="rowHeightRange"><span>Item row height</span><output class="setting-value" id="rowHeightValue" for="rowHeightRange"></output></label><input class="setting-range" id="rowHeightRange" type="range" min="34" max="88" step="1" value="46"></div>
<div class="setting-row"><label class="setting-label" for="checkboxSizeRange"><span>Checkbox size</span><output class="setting-value" id="checkboxSizeValue" for="checkboxSizeRange"></output></label><input class="setting-range" id="checkboxSizeRange" type="range" min="14" max="36" step="1" value="22"></div><div class="setting-row"><label class="setting-label" for="aisleSizeRange"><span>Aisle text size</span><output class="setting-value" id="aisleSizeValue" for="aisleSizeRange"></output></label><input class="setting-range" id="aisleSizeRange" type="range" min="11" max="24" step="1" value="14"></div>
<div class="setting-row"><label class="setting-label" for="fontSizeRange"><span>List and item font size</span><output class="setting-value" id="fontSizeValue" for="fontSizeRange"></output></label><input class="setting-range" id="fontSizeRange" type="range" min="11" max="24" step="1" value="16"></div>
<div class="settings-actions"><button type="button" class="reset-settings" id="resetSettingsBtn">Reset to default</button><button type="button" class="done-settings" id="doneSettingsBtn">Done</button></div></dialog><dialog id="sortDialog" aria-labelledby="sortTitle"><div class="grab" aria-hidden="true"></div><h2 id="sortTitle">Sort items</h2><button type="button" id="manualSort" class="sort-option" aria-pressed="true">Manual order</button><button type="button" id="aisleSort" class="sort-option" aria-pressed="false">By aisle</button><button type="button" id="sortDone" class="primary sort-done">Done</button></dialog><div id="status" class="status" role="status"></div><script>
(() => {
'use strict';
const $=id=>document.getElementById(id), KEY='myLists_v1';
let lists=[];try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(value)||value.some(l=>!l.id||typeof l.name!=='string'||!Array.isArray(l.items)))throw Error();lists=value;}catch{ $('status').textContent='Saved lists could not be read. Please reload before making changes.';return; }
let currentTab='items';
let current=null,editingId=null,returnFocus=null,longPressTimer=null,touchDrag=null;
const rows=$('rows'),editor=$('editor'),collator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
const active=()=>lists.find(l=>l.id===current);
const collection=()=>current?active().items:lists;
const completionTimers=new Map();
const canDrag=()=>!current||active().sort!=='aisle';
const notice=message=>{$('status').textContent=message;setTimeout(()=>{$('status').textContent=''},4000)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(lists));}catch{notice('Could not save. Device storage may be full or disabled.');}}
const SETTINGS_KEY='myLists_settings_v1',DEFAULT_SETTINGS={rowHeight:46,listHeight:64,aisleSize:16,fontSize:18,checkboxSize:24};
let settings={...DEFAULT_SETTINGS};
try{const stored=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');for(const [key,min,max] of [['rowHeight',34,88],['listHeight',34,88],['aisleSize',11,24],['fontSize',11,24],['checkboxSize',14,36]]){const value=stored?.[key];if(Number.isFinite(value))settings[key]=Math.round(Math.max(min,Math.min(max,value)));}}catch{}
function applySettings(){for(const [key,css] of [['rowHeight','--item-row-height'],['listHeight','--list-row-height'],['aisleSize','--aisle-font-size'],['fontSize','--list-font-size'],['checkboxSize','--task-check-size']]){document.documentElement.style.setProperty(css,settings[key]+'px');$(key+'Range').value=settings[key];$(key+'Value').textContent=settings[key]+' px';}}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch{notice('Could not save appearance settings on this device.');}}
for(const key of Object.keys(DEFAULT_SETTINGS))$(key+'Range').addEventListener('input',()=>{settings[key]=Number($(key+'Range').value);applySettings();saveSettings();});
const settingsDialog=$('settingsDialog');
$('settingsBtn').onclick=()=>{applySettings();settingsDialog.showModal();$('rowHeightRange').focus();};
$('doneSettingsBtn').onclick=()=>{settingsDialog.close();$('settingsBtn').focus();};
$('resetSettingsBtn').onclick=()=>{settings={...DEFAULT_SETTINGS};applySettings();saveSettings();};
settingsDialog.addEventListener('click',e=>{if(e.target===settingsDialog){const r=settingsDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){settingsDialog.close();$('settingsBtn').focus();}}});
applySettings();
function sorted(items){return [...items].sort((a,b)=>{if(!a.aisle)return b.aisle?1:0;if(!b.aisle)return -1;return collator.compare(a.aisle,b.aisle)});}
function render(){
 const list=active();if(current&&!list){current=null;location.hash='';return;}
 $('titleLabel').textContent=list?list.name:'Lists';$('title').setAttribute('title',list?list.name:'Lists');
 const n=list?list.items.length:lists.length;$('count').textContent=`${n} ${list?(n===1?'item':'items'):(n===1?'list':'lists')}`;

function persistDomOrder(){

  if(order.length===indexes.length&&order.every(Boolean))indexes.forEach((index,i)=>arr[index]=order[i]);
  if(!current)break;
 }
 save();
}

    row.addEventListener("dragstart",e=>{
